name: CI — lint, test, bump SW cache

# On every push to main that touches a shell file OR anything the tests cover:
# lint (no-undef gate, catches undefined-reference bugs like the dragend `p`
# ReferenceError) and unit tests run FIRST. Only if both pass does the cache
# bump run — so broken code never gets its CACHE_NAME bumped onto users'
# devices. The bump rewrites CACHE_NAME in sw.js (and the #app-version span in
# index.html) to a short hash of the shell files, committing the change back.
# A test-only or script-only push hashes to the same value and bumps nothing.
# Self-pushes don't re-run because the filter below excludes the bot actor.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'routing.js'
      - 'storage.js'
      - 'tiles.js'
      - 'suburbs.js'
      - 'style.css'
      - 'welcome-init.js'
      - 'sw.js'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'

# One run at a time on main; a newer push cancels an older in-flight run, whose
# code the newer run tests and hashes anyway. Without this two quick pushes
# raced: the older run's bump could hash the newer, still-untested commit.
concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install (pinned eslint)
        run: npm ci
      - name: no-undef lint gate
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: unit tests
        run: node --test

  bump:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      # The exact commit lint + test passed on — not whatever main is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # index.html is hashed with its #app-version span blanked out: the span IS
      # the output of this step, so hashing it made every run (including a no-op
      # workflow_dispatch) mint a new CACHE_NAME and wipe users' shell cache.
      - name: Compute new cache name
        id: hash
        run: |
          HASH=$( { sed -E 's|<span id="app-version">[^<]*</span>||' index.html; \
            cat app.js routing.js storage.js tiles.js suburbs.js style.css welcome-init.js; } \
            | sha256sum | cut -c1-8)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Computed cache hash: $HASH"

      - name: Update sw.js + index.html if hash changed
        id: update
        env:
          NEW_HASH: ${{ steps.hash.outputs.hash }}
        run: |
          NEW="legwork-${NEW_HASH}"
          CURRENT=$(grep -oE 'var CACHE_NAME = "[^"]+";' sw.js | sed -E 's/.*"([^"]+)".*/\1/')
          CURRENT_VERSION=$(grep -oE '<span id="app-version">[^<]*</span>' index.html | sed -E 's|.*>([^<]*)<.*|\1|')
          echo "Current SW:      $CURRENT"
          echo "New SW:          $NEW"
          echo "Current version: $CURRENT_VERSION"
          echo "New version:     $NEW_HASH"
          if [ "$CURRENT" = "$NEW" ] && [ "$CURRENT_VERSION" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change needed."
          else
            sed -i -E "s/var CACHE_NAME = \"[^\"]+\";/var CACHE_NAME = \"$NEW\";/" sw.js
            sed -i -E "s|<span id=\"app-version\">[^<]*</span>|<span id=\"app-version\">${NEW_HASH}</span>|" index.html
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit bump
        if: steps.update.outputs.changed == 'true'
        env:
          NEW_HASH: ${{ steps.hash.outputs.hash }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "chore: bump sw CACHE_NAME to legwork-${NEW_HASH}"
          # If main moved since this run started, a newer run owns the bump
          # (concurrency cancels us, but not if we're already here).
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$REMOTE_MAIN" != "${{ github.sha }}" ]; then
            echo "main moved to $REMOTE_MAIN; leaving the bump to that run."
            exit 0
          fi
          git push origin HEAD:main
