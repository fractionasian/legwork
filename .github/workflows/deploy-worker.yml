name: Deploy Worker

# Closes the client-ahead-of-Worker gap (docs/2026-08-30-review-deferred.md).
#
# GitHub Pages auto-publishes the client on every push to main; the Worker only
# moved when someone ran `wrangler deploy` by hand. So each push opened a window
# where live clients beacon at a Worker that may not know the route yet — the
# inverse of the migrations -> Worker -> client order the analytics plan
# prescribes. Additive changes survive that window (unknown event names are
# dropped, not 400'd); a breaking event-shape change loses writes silently.
#
# Order here is deliberate and matches that plan: tests gate everything, then
# migrations, then the deploy. Migrations FIRST so there is never a moment where
# live code queries a table that does not exist yet. Both steps are idempotent —
# wrangler tracks which migrations have run, and a deploy of unchanged code just
# mints a new version ID.
#
# Secrets required (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   needs edit rights on Workers scripts and on D1 (the
#                          exact permission labels are in Cloudflare's token
#                          editor; scope it to those two, nothing wider)
#   CLOUDFLARE_ACCOUNT_ID
# wrangler.toml sets no account_id, so the ID must come from the environment.

on:
  # Deliberate manual trigger, so the first run can be watched before anyone
  # relies on the push path.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The sw-cache bump commits back to main as the bot; without this it would
    # be a candidate to re-trigger workflows. Matches bump-sw.yml.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci, not install: worker/package-lock.json pins wrangler (^4.107.0
      # in package.json), so CI deploys with the same version as local rather
      # than whatever npx would fetch today.
      - name: install (pinned wrangler)
        working-directory: worker
        run: npm ci

      # Worker tests only — a worker change cannot break the client suite, and
      # this keeps the gate fast. Never deploy on red.
      - name: worker unit tests
        working-directory: worker
        run: npm test

      - name: apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply legwork-links --remote

      - name: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
