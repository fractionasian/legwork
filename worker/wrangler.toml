name = "legwork-tiles"
main = "src/index.js"
compatibility_date = "2026-07-07"

# Workers Cache (launched 2026-07-06): edge cache in front of this Worker's
# fetch handler, keyed by path + query + Cache-Control. A hit never invokes
# the Worker (no CPU, no R2 read) — only /v1/graph opts in via its own
# Cache-Control header; every other route explicitly sends no-store so a
# state-changing/auth-bearing response can never be served stale from cache.
[cache]
enabled = true

# R2 bucket binding. The bucket must be created once before first deploy:
#   wrangler r2 bucket create legwork-graph-cache
[[r2_buckets]]
binding = "GRAPH"
bucket_name = "legwork-graph-cache"

# Per-IP rate limit on /v1/graph (60 requests / 60 s). Belt-and-suspenders on top
# of the free plan's 100k-requests/day ceiling — stops one client burning the
# daily budget. Native Workers Rate Limiting binding; no custom domain needed.
[[ratelimits]]
name = "GRAPH_RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Per-IP rate limit on the share-link create endpoints (20 requests / 60 s).
# Native binding only permits period = 10 or 60.
[[ratelimits]]
name = "LINKS_RL"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# D1 database for share short-links. Create once, then paste the returned id:
#   wrangler d1 create legwork-links
#   wrangler d1 migrations apply legwork-links --remote
# Admin endpoints read ADMIN_SECRET (set via `wrangler secret put ADMIN_SECRET`).
[[d1_databases]]
binding = "DB"
database_name = "legwork-links"
database_id = "38de93c4-53dc-408c-afb0-9c647979f354"

# Per-IP rate limit on analytics ingest (30 requests / 60 s). Higher than the
# links limit because one active session legitimately fires several events per
# minute (pin drops, plus a 3 s-debounced route-built per edit); 30 leaves that
# uncut while bounding the flood. It does NOT make a flood harmless — see the
# write-budget note below.
[[ratelimits]]
name = "EVENT_RL"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# Per-IP budget on the /v1/graph demand counter (5 writes / 60 s). NOT a request
# limit — GRAPH_RL already caps requests at 60/60 s; this caps only the D1 write
# each request would otherwise make. Rationale + why sampling was rejected: see
# the WRITE BUDGET comment in src/index.js handleGraph.
[[ratelimits]]
name = "DEMAND_RL"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

# ── D1 write budget, account-wide ──────────────────────────────────────────
# D1's free-tier 100k writes/day is per ACCOUNT, not per database, and `events`,
# `demand`, and `links` all live in legwork-links — so an analytics write flood
# breaks the live short-link feature. Worst case from a single IP sustained for
# 24 h, per-colo (Cloudflare rate limits count per-colo, so a distributed client
# multiplies these):
#
#   /v1/graph demand   DEMAND_RL  5/60 s  →   7,200 writes/day
#   /v1/event          EVENT_RL  30/60 s  →  43,200 writes/day
#   combined                              →  50,400 ≈ 50% of the daily budget
#
# Down from 259,200 (2.6× the whole budget) before these limits, but NOT zero
# risk: a determined sustained flood can still consume half the account's daily
# D1 writes. Accepted for now — the Worker's own free-plan ceiling of 100k
# requests/day binds at roughly the same point, so such a flood is a Worker DoS
# regardless; these limits stop it also taking short links down. If it ever
# bites, the escalation is a paid D1 plan (raises the write ceiling) — NOT a
# separate database, which does not isolate an account-wide quota.

# Weekly retention sweep — prunes events past 180 days and demand past 104 weeks.
#
# "SUN", not 0, and not 1 either. Cloudflare's weekday field is 1-7 with
# **1 = Sunday**, deliberately offset from standard cron where 0 = Sunday and
# 1 = Monday. So the usual "0" is REJECTED outright, and the obvious correction
# to "1" would read as Monday to anyone who knows cron while actually meaning
# Sunday to Cloudflare. The 3-letter name is unambiguous under either convention.
#
# This bit once: the original "0 17 * * 0" made `wrangler deploy` upload the
# script fine and then fail only the schedules API call, with the reason
# ("invalid cron string") visible ONLY under
# `WRANGLER_LOG=debug WRANGLER_LOG_SANITIZE=false` — the default output just says
# "a request to the Cloudflare API failed". Deployed 2026-08-04 with no cron
# attached and nobody would have noticed until the table grew.
[triggers]
crons = ["0 17 * * SUN"]   # Sunday 17:00 UTC = Monday 01:00 AWST
